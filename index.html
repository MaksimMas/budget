<style>
/* ───────── Оформление. Цвета собраны в переменные: меняйте их здесь или в «Настройках» на сайте. ───────── */
:root{
  color-scheme:light;
  --bg:#f2f5f3; --surface:#ffffff; --sunken:#e9eeeb; --line:#dbe2de;
  --ink:#15201b; --ink2:#4d5b55; --ink3:#7a8781;

  --good:#17804f; --warn:#b26a00; --bad:#c7362f;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c0:#9aa6a0;
  --shadow:0 18px 50px rgba(21,32,27,.22);
  --r-card:18px; --r-ctl:11px;
  --font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1513; --surface:#18201d; --sunken:#222c28; --line:#2c3833;
  --ink:#e9efec; --ink2:#b3c0ba; --ink3:#84918b;
  --good:#4cc38a; --warn:#e0a13a; --bad:#f0736c;

  --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--ink2)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* каркас */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-ctl);color:var(--ink2);font-weight:550}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--ink)}
.nav button:focus-visible{outline:2.5px solid var(--accent);outline-offset:-2px}
.nav svg{flex:none}
.pill.count{margin-left:auto;background:var(--accent);color:var(--accent-ink)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.inrow{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--line);flex-wrap:wrap}

.inrow .raw{font-size:13px;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.inrow .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-left:auto}
.steps{margin:0 0 14px;padding-left:20px}
.steps li{margin-bottom:8px}
.kv>span{grid-column:1/-1;margin-bottom:-4px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-bottom:14px;font-size:13px}
.kv code,.pre{font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--sunken);padding:7px 9px;border-radius:8px;overflow-wrap:anywhere;min-width:0}
.pre{white-space:pre-wrap;margin-bottom:8px}
.side .grow{flex:1}
.who{padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{padding:26px clamp(16px,4vw,44px) 60px;max-width:1120px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin-right:auto}
.tabbar{display:none}
.mobhead{display:none}

/* элементы */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r-ctl);font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}

.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 12px;min-height:42px}

.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-ctl);padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--ink2);text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px}

.grid{display:grid;gap:16px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);padding:2px}
.monthnav button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:9px;font-size:18px}
.monthnav button:hover{background:var(--sunken)}
.monthnav button:focus-visible{outline:2.5px solid var(--accent)}
.monthnav b{min-width:128px;text-align:center;font-weight:650;text-transform:capitalize}
.empty{padding:28px 10px;text-align:center;color:var(--ink2)}
.empty .btn{margin-top:12px}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:10px 14px;border-radius:var(--r-ctl);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}

/* главный блок: остаток и темп месяца */
.hero{padding:22px 22px 20px}
.hero .lbl{color:var(--ink2);font-weight:550}
.hero .big{font-size:clamp(38px,7vw,56px);font-weight:750;letter-spacing:-.035em;line-height:1.05;margin:2px 0 16px}

.pace{position:relative;padding-top:22px}
.pace .bar{display:flex;gap:2px;height:28px;background:var(--sunken);border-radius:7px;overflow:visible}
.pace .segm{height:28px;border-radius:4px;min-width:3px;font-size:12px;font-weight:650;display:flex;align-items:center;padding-left:7px;white-space:nowrap;overflow:hidden}
.pace .today{position:absolute;top:0;height:19px;width:0;border-left:2px solid var(--ink);pointer-events:none}

.pace .today span{position:absolute;top:0;font-size:12px;font-weight:600;white-space:nowrap;line-height:1;padding:0 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:13px;color:var(--ink2);margin-top:2px}

/* списки */
.daygroup{margin-top:14px}
.daygroup>div:first-child{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600;padding:0 4px 6px}
.tx{all:unset;box-sizing:border-box;cursor:pointer;display:flex;width:100%;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.tx:hover{background:var(--sunken)}
.tx:focus-visible{outline:2.5px solid var(--accent);outline-offset:-2px}
.tx+.tx{margin-top:1px}
.badge{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--cc,var(--c0)) 20%,transparent)}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:650;white-space:nowrap}
.tx .a.inc{color:var(--good)}
.meter{margin-bottom:14px}
.meter:last-child{margin-bottom:0}
.meter .h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.meter .h span:last-child{color:var(--ink2);font-size:13px;white-space:nowrap}
.meter .track{height:8px;border-radius:99px;background:color-mix(in srgb,var(--mc) 18%,transparent)}
.meter .fill{height:8px;border-radius:99px;background:var(--mc)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .b{height:14px;border-radius:0 4px 4px 0;background:var(--cc,var(--c1));min-width:3px}
.hbar .v{font-weight:600;white-space:nowrap}
.hbar .v small{color:var(--ink3);font-weight:500;margin-left:6px}
.listrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line)}
.listrow:first-of-type{border-top:0}
.listrow .t{flex:1;min-width:0}
.listrow .t b{font-weight:600}
.pill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--sunken);color:var(--ink2);white-space:nowrap}

/* графики */
.chart{width:100%;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink3);font-size:11.5px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.chart g.band:hover .hit,.chart g.band:focus .hit{fill:color-mix(in srgb,var(--ink) 7%,transparent)}
.chart g.band:focus{outline:none}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--ink2);font-weight:600;font-size:13px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.4;max-width:240px;box-shadow:var(--shadow)}
#tip b{display:block;margin-bottom:2px}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);width:min(460px,100%);padding:22px;max-height:calc(100dvh - 32px);overflow:auto}

.modal>header h2{margin-right:auto;font-size:19px}
.modal footer{display:flex;gap:10px;margin-top:6px}
.modal footer .sp{flex:1}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 0 8px;margin-bottom:16px}
.amount:focus-within{border-color:var(--accent)}
.amount input{all:unset;flex:1;min-width:0;font-size:38px;font-weight:750;letter-spacing:-.03em}
.amount span{font-size:22px;color:var(--ink3);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:16px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:13px;border:1.5px solid var(--line);text-align:center;font-size:12.5px;line-height:1.2;font-weight:550}
.chip i{font-style:normal;font-size:21px;line-height:1.1}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 16%,transparent)}
.chip:focus-visible{outline:2.5px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;background:var(--cc);display:grid;place-items:center;color:#fff;font-weight:700}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--cc)}
.sw:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.emojis{display:flex;flex-wrap:wrap;gap:4px;max-height:118px;overflow:auto;padding:2px}
.emojis button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;font-size:20px;border-radius:9px}
.emojis button:hover,.emojis button[aria-pressed="true"]{background:var(--sunken)}
.emojis button:focus-visible{outline:2.5px solid var(--accent)}
.code{font:700 22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;background:var(--sunken);padding:14px;border-radius:12px;text-align:center;user-select:all;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:min(92vw,420px);font-weight:550}
#toast.err{background:var(--bad);color:#fff}
.center{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.welcome{width:min(440px,100%)}
.welcome h1{font-size:34px;margin:14px 0 8px}
.welcome .card{margin-top:22px}
.toggle{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.fab{display:none}

/* телефон */
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .main{padding:14px 14px 110px}
  .mobhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mobhead select{flex:1;min-width:0;font-weight:650;border:0;background:transparent;font-size:16px;padding:6px 0}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;font-size:11.5px;font-weight:600;color:var(--ink3);border-radius:10px}
  .tabbar button svg{width:22px;height:22px;margin-bottom:2px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button:focus-visible{outline:2.5px solid var(--accent);outline-offset:-2px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
  .top .addbtn{display:none}
  .cols2,.cols3{grid-template-columns:minmax(0,1fr)}
  .tiles{gap:10px}
  .tile{padding:12px 12px}
  .tile .v{font-size:17px}
  .tile .d{display:none}
  .card{padding:16px}
  h1{font-size:22px}
  .overlay{place-items:end center;padding:0}
  .modal{width:100%;border-radius:22px 22px 0 0;max-height:94dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  .monthnav b{min-width:112px}
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(14px);opacity:0}}
}
</style>

/* Разбор текста банковского уведомления: «Покупка 350р SAMBERI Баланс: 1 000р» → сумма, тип, магазин.
   Возвращает null, если в тексте нет суммы в рублях (коды входа, реклама и т. п.). */
function parseBank(raw){
  const t = String(raw).replace(/[\u00a0\u202f\u2009]/g, ' ').replace(/\s+/g, ' ').trim();
  const main = t.split(/(?:Баланс|Доступно|Остаток|Лимит)/i)[0];
  const m = main.match(/(?<![\d:.,*\-])(\d{1,3}(?: \d{3})+|\d+)(?:[.,](\d{1,2}))?\s?(?:₽|руб(?:лей|ля|ль|\.)?(?![а-яёa-z])|р\.?(?![а-яёa-z])|RUB|RUR)/i);
  if (!m) return null;
  if (/одобрен|предложени|акци[яию]|скидк|кредит до/i.test(main) && !/покупка|оплата|списание|перевод|зачислен/i.test(main)) return null;
  const amount = parseFloat(m[1].replace(/ /g, '') + '.' + (m[2] || '0'));
  if (!(amount > 0)) return null;
  const income = /зачислен|поступлен|пополнен|возврат|кэшбэк|кешбэк|зарплат|аванс|входящий|вам перев|перевод[^.]{0,40}?\sот\s/i.test(main);
  const clean = x => x.replace(/сбербанк онлайн|сбербанк|сбер/gi, ' ').replace(/(?:MIR|VISA|MASTERCARD|ECMC|СЧЁТ|СЧЕТ|КАРТА)?[-*•· ]{0,3}\d{4}(?!\d)/gi, ' ')
    .replace(/\d{1,2}:\d{2}/g, ' ').replace(/\d{2}\.\d{2}(?:\.\d{2,4})?/g, ' ').replace(/\s+/g, ' ').replace(/^[\s.,:;—–-]+|[\s.,:;—–-]+$/g, '');
  let merchant = clean(main.slice(m.index + m[0].length));
  if (!merchant) merchant = clean(main.slice(0, m.index)).replace(/^(?:покупка|оплата|списание)\s*/i, '');
  merchant = merchant.replace(/^(?:покупка|оплата|списание)[\s.,:]+/i, '').slice(0, 80);
  return {amount, kind: income ? 'income' : 'expense', merchant, key: merchant.toLowerCase().replace(/\s+/g, ' ').slice(0, 80)};
}

class RemoteStore {
  constructor(url, key){ this.url = url.trim().replace(/\/+$/,''); this.key = key.trim(); this.sess = ls.get('session'); this.remote = true; }

  drop(){ this.sess = null; ls.del('session'); }
  async refresh(){
    if (!this.sess?.refresh_token) return false;
    if (!this._ref) this._ref = (async () => {
      try{
        const r = await fetch(this.url + '/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:this.key,'Content-Type':'application/json'}, body: JSON.stringify({refresh_token:this.sess.refresh_token})});

      }catch{ return false; } finally{ this._ref = null; }

  }
  async req(path, {method='GET', body, headers={}, auth=true, retry=true} = {}){

    if (auth && !this.sess) throw new AuthLost('Сессия закончилась. Войдите снова.');

    catch{ throw new Error('Нет связи с сервером. Проверьте интернет и попробуйте снова.'); }
    if (r.status === 401 && auth && retry){
      if (await this.refresh()) return this.req(path, {method, body, headers, auth, retry:false});

  $('meta[name=theme-color]').content = dark ? '#0f1513' : '#f2f5f3';
}
function savePrefs(){ ls.set('prefs', S.prefs); applyPrefs(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyPrefs(); render(); });

let toastTimer;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, err ? 6000 : 2600); }
async function guard(fn){
  try{ return await fn(); }
  catch(e){
    if (e instanceof AuthLost){ S.user = null; S.screen = 'auth'; closeModal(); render(); }
    toast(e.message || 'Что-то пошло не так', true); console.error(e);
  }
}

/* ───────────────────────── Загрузка данных ───────────────────────── */
async function boot(){
  applyPrefs();
  const conn = CONFIG.supabaseUrl && CONFIG.supabaseKey ? {url:CONFIG.supabaseUrl, key:CONFIG.supabaseKey} : ls.get('conn');
  if (ls.get('mode') === 'demo') S.store = new LocalStore();
  else if (conn) S.store = new RemoteStore(conn.url, conn.key);
  else { S.screen = 'welcome'; return render(); }
  S.user = await S.store.init();
  if (!S.user){ S.screen = 'auth'; return render(); }
  await enter();
}
async function enter(){
  S.budgets = await S.store.budgets();
  const join = (location.hash.match(/join=([A-Za-z0-9]+)/) || [])[1];
  if (!S.budgets.length){ S.screen = 'onboard'; render(); if (join) openJoin(join); return; }
  const want = ls.get('budget');
  await openBudget((S.budgets.find(b => b.id === want) || S.budgets[0]).id);
  if (join) openJoin(join);
}
async function openBudget(id){
  S.budget = S.budgets.find(b => b.id === id); ls.set('budget', id);
  S.loadedFrom = addMonths(curMonth(), -13) + '-01';
  [S.members, S.cats, S.txs] = await Promise.all([S.store.members(id), S.store.cats(id), S.store.txs(id, S.loadedFrom)]);
  await loadInbox(); sortTx(); S.screen = 'app'; render();
}
/* «Входящие» и правила категорий: если таблиц ещё нет (старая schema.sql), сайт работает без них */
async function loadInbox(){
  S.inbox = []; S.rules = [];
  if (!canEdit()) return;
  try{ [S.inbox, S.rules] = await Promise.all([S.store.inbox(S.budget.id), S.store.rules(S.budget.id)]); S.inboxOff = false; }
  catch(e){ if (e instanceof AuthLost) throw e; S.inboxOff = true; }
}
function suggestCat(p){ const c = catOf(S.rules.find(r => r.pattern === p.key)?.category_id); return c && c.kind === p.kind && !c.archived ? c : null; }
const inboxItems = () => S.inbox.map(n => { const p = parseBank((n.title ? n.title + ' ' : '') + n.body); return {n, p, c: p && suggestCat(p)}; });
/* подгрузить более старые месяцы, если пользователь листает назад */
async function ensureRange(month){
  const need = month + '-01';
  if (!S.loadedFrom || need >= S.loadedFrom) return;
  S.loadedFrom = need; S.txs = await S.store.txs(S.budget.id, need); sortTx();
}
/* фоновое обновление, чтобы видеть операции других участников */
async function refresh(silent){
  if (S.screen !== 'app' || !S.store.remote || $('#layer').children.length) return;
  try{
    const id = S.budget.id, sig = JSON.stringify([S.members, S.cats, S.txs, S.inbox, S.rules]);
    const [m, c, t] = await Promise.all([S.store.members(id), S.store.cats(id), S.store.txs(id, S.loadedFrom)]);
    if (id !== S.budget?.id || $('#layer').children.length) return;
    S.members = m; S.cats = c; S.txs = t; sortTx(); await loadInbox();
    if (id !== S.budget?.id || $('#layer').children.length) return;
    if (JSON.stringify([S.members, S.cats, S.txs, S.inbox, S.rules]) !== sig) render();
  }catch(e){ if (e instanceof AuthLost){ S.user = null; S.screen = 'auth'; render(); } else if (!silent) toast(e.message, true); }
}
addEventListener('hashchange', () => { const c = (location.hash.match(/join=([A-Za-z0-9]+)/) || [])[1]; if (c && S.user && ['app','onboard'].includes(S.screen)) openJoin(c); });
setInterval(() => { if (!document.hidden) refresh(true); }, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });

/* ───────────────────────── Обзор ───────────────────────── */
function txRow(t){
  const c = catOf(t.category_id), many = S.members.length > 1;
  const sub = [t.note && c ? c.name : '', many ? memberName(t.created_by) : ''].filter(Boolean).join(', ');
  return `<button class="tx" data-act="editTx" data-id="${t.id}">
    <span class="badge" style="--cc:var(--c${c ? c.color : 0})">${c ? esc(c.icon) : '❔'}</span>
    <span class="t"><b>${esc(t.note || (c ? c.name : 'Без категории'))}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>
    <span class="a num ${t.kind === 'income' ? 'inc' : ''}">${t.kind === 'income' ? '+' : '−'}${money(+t.amount)}</span></button>`;
}
function byCategory(list, kind){
  const map = new Map();
  for (const t of list) if (t.kind === kind) map.set(t.category_id, (map.get(t.category_id) || 0) + +t.amount);
  return [...map].map(([id, v]) => ({id, v, c:catOf(id)})).sort((a,b) => b.v - a.v);
}
function paceBlock(list, E, I){
  if (!E) return '';
  const whole = I > 0 ? Math.max(I, E) : E;
  let parts = byCategory(list, 'expense');
  if (parts.length > 6){ const rest = parts.slice(5); parts = parts.slice(0,5).concat({id:'rest', v:sum(rest, x => x.v), c:{name:'Остальное', color:0}}); }
  const isCur = S.month === curMonth(), dayFrac = new Date().getDate() / daysIn(S.month);
  const segs = parts.map(p => { const col = cssVar('--c' + (p.c ? p.c.color : 0)), share = p.v / whole, pct = Math.round(p.v / E * 100);
    return `<div class="segm" tabindex="0" style="flex:${p.v} 0 0;background:var(--c${p.c ? p.c.color : 0});color:${inkOn(col)}" data-tip="${esc(p.c ? p.c.name : 'Без категории')}|${money(p.v)}, ${pct}% расходов">${share > .09 ? pct + '%' : ''}</div>`; }).join('');
  const free = whole - E;
  const right = dayFrac > .7;
  return `<div class="pace">
      ${isCur && I > 0 ? `<div class="today" style="left:${(dayFrac*100).toFixed(1)}%"><span style="${right ? 'right:0' : 'left:0'}">сегодня</span></div>` : ''}
      <div class="bar" role="img" aria-label="Расходы по категориям относительно дохода">${segs}${free > 0 ? `<div style="flex:${free} 0 0"></div>` : ''}</div>
    </div>
    <div class="legend">${parts.map(p => `<span><i style="background:var(--c${p.c ? p.c.color : 0})"></i>${esc(p.c ? p.c.name : 'Без категории')}</span>`).join('')}</div>
    ${I > 0 ? `<p class="muted small" style="margin-top:10px">Потрачено ${Math.round(E/I*100)}% дохода${isCur ? `, прошло ${Math.round(dayFrac*100)}% месяца. ${E/I > dayFrac + .05 ? 'Траты идут быстрее календаря.' : 'Траты идут в спокойном темпе.'}` : '.'}</p>` : ''}`;
}
function limitsBlock(list){
  const rows = S.cats.filter(c => c.kind === 'expense' && c.monthly_limit && !c.archived).map(c => ({c, spent:sum(list.filter(t => t.category_id === c.id && t.kind === 'expense'), t => +t.amount)}));
  if (!rows.length) return `<div class="empty">Лимитов пока нет. Задайте месячный лимит в карточке категории, и здесь появится прогресс.${canEdit() ? `<br><button class="btn sm" data-act="go" data-v="cats">Открыть категории</button>` : ''}</div>`;
  return rows.sort((a,b) => b.spent/b.c.monthly_limit - a.spent/a.c.monthly_limit).map(({c, spent}) => {
    const k = spent / c.monthly_limit, col = k > 1 ? 'var(--bad)' : k >= .8 ? 'var(--warn)' : 'var(--accent)';
    const note = k > 1 ? `⚠ превышен на ${money(spent - c.monthly_limit)}` : `${k >= .8 ? '◔ ' : ''}осталось ${money(c.monthly_limit - spent)}`;
    return `<div class="meter" style="--mc:${col}"><div class="h"><span>${esc(c.icon)} ${esc(c.name)}</span><span class="num">${note}</span></div>
      <div class="track" role="img" aria-label="${esc(c.name)}: ${money(spent)} из ${money(+c.monthly_limit)}"><div class="fill" style="width:${Math.min(100, k*100).toFixed(1)}%"></div></div></div>`;
  }).join('');
}
function viewHome(){
  const list = monthTx(S.month), E = exp(list), I = inc(list), W = S.prefs.widgets;
  const isCur = S.month === curMonth(), days = isCur ? new Date().getDate() : daysIn(S.month);
  const prev = monthTx(addMonths(S.month, -1)), pE = exp(prev);
  const left = I - E;
  const hero = I > 0
    ? `<div class="lbl">${left >= 0 ? `Осталось на ${monthOnly(S.month)}` : `Перерасход за ${monthOnly(S.month)}`}</div><div class="big ${left < 0 ? 'neg' : ''}">${money(Math.abs(left))}</div>`
    : `<div class="lbl">Потрачено за ${monthOnly(S.month)}</div><div class="big">${money(E)}</div>`;
  const delta = pE ? `${E >= pE ? 'на ' + Math.round((E/pE-1)*100) + '% больше' : 'на ' + Math.round((1-E/pE)*100) + '% меньше'}, чем в прошлом месяце` : 'в прошлом месяце расходов не было';
  if (!S.txs.length && !list.length) return `<div class="top"><h1>Обзор</h1>${monthNav()}</div>
    <div class="card empty"><h2>Пока нет ни одной операции</h2><p style="margin-top:6px">Добавьте первую трату или доход, и здесь появится картина месяца.</p>${canEdit() ? `<button class="btn primary" data-act="addTx">Добавить операцию</button>` : ''}</div>`;
  return `<div class="top"><h1>Обзор</h1>${monthNav()}${addBtn()}</div>
  ${S.inbox.length ? `<div class="banner info"><span>Во «Входящих» ${S.inbox.length} уведомл. из банка, которые ещё не разобраны.</span><button class="btn sm" data-act="go" data-v="inbox">Разобрать</button></div>` : ''}
  <div class="grid">
    <section class="card hero">${hero}${W.pace ? paceBlock(list, E, I) : ''}</section>
    <div class="tiles">
      <div class="card tile"><div class="muted small">Доходы</div><div class="v num">${money(I)}</div><div class="d">${list.filter(t => t.kind === 'income').length} поступл.</div></div>
      <div class="card tile"><div class="muted small">Расходы</div><div class="v num">${money(E)}</div><div class="d">${delta}</div></div>
      <div class="card tile"><div class="muted small">В среднем в день</div><div class="v num">${money(E / days)}</div><div class="d">за ${days} дн.</div></div>
    </div>
    ${W.days ? chartCard('days', 'Расходы по дням') : ''}
    <div class="grid cols2">
      ${W.limits ? `<section class="card"><header><h2>Лимиты</h2></header>${limitsBlock(list)}</section>` : ''}
      ${W.recent ? `<section class="card"><header><h2>Последние операции</h2><button class="btn ghost sm" data-act="go" data-v="tx">Все</button></header>${list.slice(0,6).map(txRow).join('') || '<div class="empty">В этом месяце операций нет</div>'}</section>` : ''}
    </div>
  </div>`;
}

/* ───────────────────────── Операции ───────────────────────── */
function viewTx(){
  const f = S.filter, q = f.q.trim().toLowerCase();
  const list = monthTx(S.month).filter(t => (!f.kind || t.kind === f.kind) && (!f.cat || t.category_id === f.cat) && (!f.who || t.created_by === f.who)
    && (!q || (t.note + ' ' + (catOf(t.category_id)?.name || '')).toLowerCase().includes(q)));
  const groups = new Map(); for (const t of list){ if (!groups.has(t.occurred_on)) groups.set(t.occurred_on, []); groups.get(t.occurred_on).push(t); }
  const filtered = f.q || f.cat || f.who || f.kind;
  return `<div class="top"><h1>Операции</h1>${monthNav()}${addBtn()}</div>
  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <input class="input" style="flex:2;min-width:160px" type="search" placeholder="Поиск по заметке или категории" value="${esc(f.q)}" data-inp="q" aria-label="Поиск">
      <select class="input" style="flex:1;min-width:130px" data-chg="fKind" aria-label="Тип"><option value="">Доходы и расходы</option><option value="expense" ${f.kind === 'expense' ? 'selected' : ''}>Только расходы</option><option value="income" ${f.kind === 'income' ? 'selected' : ''}>Только доходы</option></select>
      <select class="input" style="flex:1;min-width:130px" data-chg="fCat" aria-label="Категория"><option value="">Все категории</option>${S.cats.map(c => `<option value="${c.id}" ${f.cat === c.id ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select>
      ${S.members.length > 1 ? `<select class="input" style="flex:1;min-width:130px" data-chg="fWho" aria-label="Участник"><option value="">Все участники</option>${S.members.map(m => `<option value="${m.user_id}" ${f.who === m.user_id ? 'selected' : ''}>${esc(m.display_name)}</option>`).join('')}</select>` : ''}
    </div>

function hbars(rows, total){
  if (!rows.length) return '<div class="empty">Нет данных за этот период</div>';
  const max = rows[0].v;
  return rows.map(r => `<div class="hbar" style="--cc:${r.color}"><span class="n">${r.label}</span><div><div class="b" style="width:${(r.v/max*100).toFixed(1)}%"></div></div><span class="v num">${money(r.v)}<small>${Math.round(r.v/total*100)}%</small></span></div>`).join('');
}
function viewStats(){
  const months = Array.from({length:S.statsSpan}, (_, i) => addMonths(S.month, i - S.statsSpan + 1));
  const list = S.txs.filter(t => t.occurred_on.slice(0,7) >= months[0] && t.occurred_on.slice(0,7) <= S.month);
  const E = exp(list), I = inc(list);
  let cats = byCategory(list, 'expense');
  if (cats.length > 9){ const rest = cats.slice(8); cats = cats.slice(0,8).concat({id:'rest', v:sum(rest, x => x.v), c:{name:'Остальные категории', icon:'…', color:0}}); }
  const who = S.members.map(m => ({m, v:sum(list.filter(t => t.kind === 'expense' && t.created_by === m.user_id), t => +t.amount)})).filter(x => x.v).sort((a,b) => b.v - a.v);

/* ───────────────────────── Графики (SVG) ───────────────────────── */
function axis(max){ const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)), step = [1,2,5,10].map(k => k*p).find(s => s >= raw), n = Math.ceil(max / step); return {step, n, top:step*n}; }
function columns(el, {labels, tips, series, labelEvery=1}){
  const W = Math.max(280, el.clientWidth), H = 210, pl = 46, pr = 4, pt = 8, pb = 24, n = labels.length, k = series.length;
  const {step, n:tn, top} = axis(Math.max(4, ...series.flatMap(s => s.values))), band = (W - pl - pr) / n, y = v => pt + (H - pt - pb) * (1 - v / top);
  const bw = Math.max(2, Math.min(24, (band * .78 - 2 * (k - 1)) / k)), groupW = bw * k + 2 * (k - 1);
  let g = '';
  for (let i = 0; i <= tn; i++){ const v = step * i; g += `<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`; }
  labels.forEach((lab, i) => {
    const x0 = pl + band * i, gx = x0 + (band - groupW) / 2;
    let bars = '';
    series.forEach((s, j) => { const v = s.values[i]; if (v <= 0) return; const h = Math.max(1.5, y(0) - y(v)), r = Math.min(4, bw/2, h), x = gx + j * (bw + 2), yy = y(0) - h;
      bars += `<path fill="${s.color}" d="M${x},${y(0)}V${yy+r}q0,${-r} ${r},${-r}h${bw-2*r}q${r},0 ${r},${r}V${y(0)}z"/>`; });
    g += `<g class="band" tabindex="0" data-tip="${esc(tips[i])}"><rect class="hit" x="${x0}" y="${pt}" width="${band}" height="${H-pt-pb}" rx="6"/>${bars}</g>`;
    if (i % labelEvery === 0) g += `<text x="${x0 + band/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = (k > 1 ? `<div class="legend" style="margin:0 0 10px">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '') +
    `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Столбчатая диаграмма">${g}</svg>`;
}
function dataTable(head, rows){ return `<table class="data"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
function drawCharts(){
  for (const el of document.querySelectorAll('[data-chart]')){
    const id = el.dataset.chart;
    if (id === 'days'){
      const n = daysIn(S.month), vals = Array(n).fill(0);
      for (const t of monthTx(S.month)) if (t.kind === 'expense') vals[+t.occurred_on.slice(8) - 1] += +t.amount;
      const mShort = monthName(S.month, true);
      if (S.table[id]) el.innerHTML = dataTable(['День','Расходы'], vals.map((v, i) => [`${i+1} ${mShort}`, money(v)]).filter((_, i) => vals[i] > 0));
      else columns(el, {labels:vals.map((_, i) => i + 1), tips:vals.map((v, i) => `${i+1} ${mShort}|${v ? money(v) : 'без расходов'}`), series:[{name:'Расходы', color:'var(--accent)', values:vals}], labelEvery: el.clientWidth < 520 ? 5 : 2});
    }
    if (id === 'monthly'){
      const months = Array.from({length:S.statsSpan}, (_, i) => addMonths(S.month, i - S.statsSpan + 1));
      const I = months.map(m => inc(monthTx(m))), E = months.map(m => exp(monthTx(m)));
      if (S.table[id]) el.innerHTML = dataTable(['Месяц','Доходы','Расходы','Разница'], months.map((m, i) => [monthName(m), money(I[i]), money(E[i]), money(I[i]-E[i], {sign:true})]));
      else columns(el, {labels:months.map(m => monthName(m, true)), tips:months.map((m, i) => `${monthName(m)}|Доходы: ${money(I[i])}|Расходы: ${money(E[i])}|Разница: ${money(I[i]-E[i], {sign:true})}`),
        series:[{name:'Доходы', color:'var(--c1)', values:I}, {name:'Расходы', color:'var(--c2)', values:E}]});
    }
  }
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 120); });

const forms = {
  async connect(f){
    const url = f.url.value.trim().replace(/\/+$/,''), key = f.key.value.trim();
    if (!/^https:\/\/.+/.test(url)) throw new Error('Адрес проекта должен начинаться с https://');
    let r; try{ r = await fetch(url + '/auth/v1/settings', {headers:{apikey:key}}); }catch{ throw new Error('Не удалось связаться с этим адресом. Проверьте адрес проекта и интернет.'); }
    if (!r.ok) throw new Error('Supabase не принял ключ. Проверьте адрес проекта и ключ.');
    ls.set('conn', {url, key}); ls.del('mode'); location.reload();
  },
  async auth(f){
    const email = f.email.value.trim(), pw = f.password.value;
    if (S.authMode === 'up'){
      const u = await S.store.signUp(email, pw, f.name.value.trim());
      if (!u){ S.authMode = 'in'; render(); toast('Аккаунт создан. Подтвердите почту по ссылке из письма, затем войдите.'); return; }
      S.user = u;
    } else S.user = await S.store.signIn(email, pw);
    await enter();
  },
  async newBudget(f){
    const id = await S.store.createBudget(f.name.value.trim(), f.currency.value, f.display.value.trim());
    if (f.defaults.checked) await S.store.saveCats(DEFAULT_CATEGORIES.map(([kind,icon,name], i) => ({id:uid(), budget_id:id, name, kind, icon, color:i%8+1, monthly_limit:null, sort:i, archived:false})));
    closeModal(); S.budgets = await S.store.budgets(); S.view = 'home'; S.month = curMonth(); await openBudget(id); toast('Бюджет создан');
  },
  async join(f){
    const id = await S.store.joinBudget(f.code.value.trim(), f.name.value.trim());
    history.replaceState(null, '', location.pathname); closeModal();
    S.budgets = await S.store.budgets(); S.view = 'home'; await openBudget(id); toast('Вы присоединились к бюджету');
  },
  async paste(f){ const p = parseBank(f.text.value); if (!p) throw new Error('Не нашёл в тексте сумму в рублях. Проверьте, что вставлен текст операции целиком.'); openParsed(p, suggestCat(p), null); },
  async tx(f){
    const amount = parseAmount(f.amount.value);
    if (!(amount > 0)) { f.amount.focus(); throw new Error('Введите сумму больше нуля, например 1250 или 250+90'); }
    if (!M.tx.category_id && S.cats.some(c => c.kind === M.tx.kind && !c.archived)) throw new Error('Выберите категорию');
    const t = {...M.tx, amount, occurred_on:f.date.value, note:f.note.value.trim()};
    await S.store.saveTx(t, M.isNew);
    if (M.isNew){ S.txs.push({...t, created_by:S.user.id, created_at:new Date().toISOString()}); ls.set('lastCat', t.category_id); }
    else Object.assign(S.txs.find(x => x.id === t.id), t);
    if (M.inboxId){ await S.store.setInbox(M.inboxId, 'done'); S.inbox = S.inbox.filter(n => n.id !== M.inboxId); }
    if (M.ruleKey && t.category_id && !S.inboxOff && S.rules.find(r => r.pattern === M.ruleKey)?.category_id !== t.category_id){
      try{ await S.store.saveRule(S.budget.id, M.ruleKey, t.category_id); S.rules = S.rules.filter(r => r.pattern !== M.ruleKey).concat({pattern:M.ruleKey, category_id:t.category_id}); }catch(e){ console.warn(e); }
    }
    const stay = !!(M.inboxId || M.ruleKey);
    sortTx(); const wasNew = M.isNew; closeModal();
    if (!stay && t.occurred_on.slice(0,7) !== S.month && t.occurred_on.slice(0,7) <= curMonth()) S.month = t.occurred_on.slice(0,7);
    render(); toast(wasNew ? 'Операция добавлена' : 'Сохранено');
  },
  async cat(f){
    let limit = null;
    if (f.limit && f.limit.value.trim()){ limit = parseAmount(f.limit.value); if (!(limit > 0)) { f.limit.focus(); throw new Error('Лимит должен быть числом больше нуля. Оставьте поле пустым, чтобы убрать лимит.'); } }
    const c = {...M.cat, name:f.name.value.trim(), icon:f.icon.value.trim() || '📦', monthly_limit:limit, archived: f.archived ? f.archived.checked : false};
    await S.store.saveCat(c, M.isNew);
    if (M.isNew) S.cats.push(c); else Object.assign(catOf(c.id), c);
    closeModal(); render(); toast('Категория сохранена');
  },
  async rename(f){ const name = f.name.value.trim(); await S.store.renameSelf(S.budget.id, name); S.members.find(m => m.user_id === S.user.id).display_name = name; closeModal(); render(); },
  async budget(f){ const patch = {name:f.name.value.trim(), currency:f.currency.value}; await S.store.updateBudget(S.budget.id, patch); Object.assign(S.budget, patch); render(); toast('Сохранено'); },
};

});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const btn = f.querySelector('button.primary'); if (btn?.disabled) return; if (btn) btn.disabled = true;
  guard(() => forms[f.dataset.form](f)).finally(() => { if (btn?.isConnected) btn.disabled = false; });
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el) guard(() => changes[el.dataset.chg](el)); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el) inputs[el.dataset.inp](el); });

/* подсказки на графиках */
const tip = $('#tip');
function showTip(el, x, y){
  const [head, ...rest] = el.dataset.tip.split('|');
  tip.innerHTML = `<b>${esc(head)}</b>${rest.map(esc).join('<br>')}`; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width/2)) + 'px';
  tip.style.top = (y - r.height - 14 < 8 ? y + 18 : y - r.height - 14) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest?.('[data-tip]'); el ? showTip(el, e.clientX, e.clientY) : tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest?.('[data-tip]'); if (el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width/2, r.top); } });
document.addEventListener('focusout', () => tip.hidden = true);
addEventListener('scroll', () => tip.hidden = true, {passive:true});

boot().catch(e => { console.error(e); if (e instanceof AuthLost){ S.screen = 'auth'; } else { S.error = e.message || String(e); S.screen = 'error'; } render(); });
</script>
</body>
